[package]
name = "modular-agent-audio"
version = "0.7.1"
description = "Audio Modules for Modular Agent"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2024"
license = "Apache-2.0 OR MIT"

[dependencies]
base64 = "0.23"
log = "0.4"
modular-agent-core = { path = "../../crates/modular-agent-core" }
rodio = "0.23"

# Mic capture (optional)
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.3", optional = true }

# Transcription engines (optional)
whisper-rs = { version = "0.16", optional = true }
sherpa-onnx = { version = "2", optional = true }
rubato = { version = "5", optional = true }

[features]
default = []
capture = ["cpal", "rtrb"]
transcribe = ["capture", "whisper-rs", "rubato"]
sherpa = ["capture", "sherpa-onnx", "rubato"]
_gpu = []
transcribe-cuda = ["transcribe", "whisper-rs/cuda", "_gpu"]
transcribe-vulkan = ["transcribe", "whisper-rs/vulkan", "_gpu"]
transcribe-metal = ["transcribe", "whisper-rs/metal", "_gpu"]
transcribe-coreml = ["transcribe", "whisper-rs/coreml", "_gpu"]
